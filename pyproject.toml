[project]
name = "inday-qube-demo"
version = "0.1.0"
description = "Inday demo: Quanser Qube pendulum with cnppo."
requires-python = ">=3.10"
dependencies = [
    "cnppo",
    "gymqube",
    "moviepy",
    "rich",
    "tensorboard",
    "tqdm",
]

[tool.uv.sources]
cnppo = { git = "https://github.com/jkbjh/cn-ppo-paper-code.git" }
gymqube = { path = "deps/quanser-qube" }

[project.optional-dependencies]
dev = ["pdbpp", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inday_qube_demo"]

[tool.ruff]
line-length = 88
